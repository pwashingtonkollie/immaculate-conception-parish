<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immaculate Conception Parish — Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body class="page-center">
  <main class="card login-card">
    <div class="church-mark" aria-hidden="true">✝</div>
    <h1>Immaculate Conception Parish</h1>
    <p class="subtitle">Parish Management System</p>
    <form id="loginForm">
      <label for="email">Administrator Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Log in</button>
      <p id="loginMessage" class="message" role="status"></p>
    </form>
    <p class="small">Immaculate Conception Parish © 2026</p>
  </main>
</body>
</html>
